name: Apply S3 and PVE API token Terraform code

on:
  push:
    branches: [ "main" ]
  
  workflow_dispatch:

jobs:
  tailscale_connect:
    environment: pve
    
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET    }}
          tags: tag:ci

  global_s3:
    needs: tailscale_connect
    environment: pve
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: global/s3

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID     }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan

      - name: Terraform apply
        run: terraform apply

  global_pve:
    needs: [tailscale_connect, global_s3]
    environment: pve
    runs-on: ubuntu-latest

    env:
      PROXMOX_VE_ENDPOINT:   ${{ secrets.PROXMOX_VE_ENDPOINT   }}
      PROXMOX_VE_USERNAME:   ${{ secrets.PROXMOX_VE_USERNAME   }}
      PROXMOX_VE_PASSWORD:   ${{ secrets.PROXMOX_VE_PASSWORD   }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID     }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    defaults:
      run:
        working-directory: global/pve

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan 

      - name: Terraform apply
        run: terraform apply

    